[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = "^3.10"
ops = "^3.3.0"
tenacity = "^9.1.2"
boto3 = "^1.38.36"
overrides = "^7.7.0"
requests = "2.32.4"
# Official name: ruamel.yaml, but due to Poetry GH#109 - replace dots with dashes
ruamel-yaml = "0.18.14"
shortuuid = "1.0.13"
pydantic = ">= 1.0"
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
data-platform-helpers = "^0.1.7"
poetry-core = "<2.0.0"
opensearch-charms-single-kernel = "0.0.5"
# opensearch-charms-single-kernel = {git = "https://github.com/canonical/opensearch-single-kernel-library"}


[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = "^3.3.0"
# data_platform_libs/v0/upgrade.py
pydantic = ">= 1.0"
# tls_certificates_interface/v3/tls_certificates.py
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
# grafana_agent/v0/cos_agent.py
cosl = "^1.0.0"
bcrypt = "^4.3.0"
email-validator = ">=2"


[tool.poetry.group.integration.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^0.21.2"
pytest-operator = "^0.42.0"
juju = "^3.6.1.2"
ops = "^3.3.0"
tenacity = "^9.1.2"
pyyaml = "^6.0.2"
urllib3 = "^2.4.0"
protobuf = "^6.31.1"
opensearch-py = "^2.8.0"
allure-pytest = "^2.14.3"
allure-pytest-default-results = "^0.1.3"
opensearch-charms-single-kernel = "0.0.5"
# opensearch-charms-single-kernel = {git = "https://github.com/canonical/opensearch-single-kernel-library"}

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
asyncio_mode = "auto"

[build-system]
build-backend = "poetry.core.masonry.api"
