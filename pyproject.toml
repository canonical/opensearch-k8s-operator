[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = "^3.10"
ops = "^3.3.0"
tenacity = "^9.1.2"
boto3 = "^1.38.36"
overrides = "^7.7.0"
requests = "2.32.4"
# Official name: ruamel.yaml, but due to Poetry GH#109 - replace dots with dashes
ruamel-yaml = "0.18.14"
shortuuid = "1.0.13"
pydantic = ">= 1.0"
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
data-platform-helpers = "^0.1.7"
poetry-core = "<2.0.0"
opensearch-charms-single-kernel = "0.0.6"


[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = "^3.3.0"
# data_platform_libs/v0/upgrade.py
pydantic = ">= 1.0"
# tls_certificates_interface/v3/tls_certificates.py
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
# grafana_agent/v0/cos_agent.py
cosl = "^1.0.0"
bcrypt = "^4.3.0"
email-validator = ">=2"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
black = "^26.3.1"
isort = "^6.0.1"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
black = "^26.3.1"
isort = "^6.0.1"
flake8 = "^7.0.0"
flake8-docstrings = "^1.7.0"
flake8-copyright = "^0.2.4"
flake8-builtins = "^2.5.0"
pyproject-flake8 = "^7.0.0"
pep8-naming = "^0.15.1"
codespell = "^2.4.1"
shellcheck-py = "^0.10.0.1"

[tool.poetry.group.integration.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^0.21.2"
pytest-operator = "^0.42.0"
juju = "^3.6.1.2"
ops = "^3.3.0"
tenacity = "^9.1.2"
pyyaml = "^6.0.2"
urllib3 = "^2.4.0"
protobuf = "^6.31.1"
opensearch-py = "^2.8.0"
allure-pytest = "^2.14.3"
allure-pytest-default-results = "^0.1.3"
opensearch-charms-single-kernel = "0.0.6"

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
asyncio_mode = "auto"

[build-system]
build-backend = "poetry.core.masonry.api"

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py310"]

[tool.isort]
profile = "black"

# Linting tools configuration
[tool.flake8]
max-line-length = 99
max-doc-length = 99
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".tox",
    "build",
    "dist",
    "*.egg_info",
    "venv",
    ".coverage",
    ".poetry",
]
select = ["E", "W", "F", "C", "N", "R", "D", "H"]
# Ignore W503, E501 because using black creates errors with this
# Ignore D107 Missing docstring in __init__
# Ignore D415 Docstring first line punctuation (doesn't make sense for properties)
# Ignore N818 Exceptions end with "Error" (not all exceptions are errors)
ignore = ["W503", "E501", "D107", "D415", "N818"]
# D100, D101, D102, D103: Ignore missing docstrings in tests
per-file-ignores = ["tests/*:D100,D101,D102,D103,D104"]
docstring-convention = "google"
# Check for properly formatted copyright header in each file
copyright-check = "True"
copyright-author = "Canonical Ltd."
copyright-regexp = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+%(author)s"
